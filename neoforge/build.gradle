plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-lib:${jei_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

// common still carries an older copy of the NeoForge global loot modifier list; the loader copy is the live one.
tasks.matching { it.name in ['processResources', 'sourcesJar'] }.configureEach {
    eachFile { details ->
        if (details.relativePath.pathString == 'data/neoforge/loot_modifiers/global_loot_modifiers.json'
                && details.file.toPath().toString().contains(File.separator + 'common' + File.separator)) {
            details.exclude()
        }
    }
}

// Dedicated-server checks are compiled only for an explicit development test run.
if (project.hasProperty('selftest')) {
    sourceSets.main.java.srcDir 'src/selftest/java'
    def coverageDir = layout.buildDirectory.dir('coverage-run').get().asFile
    def coverageResult = layout.buildDirectory.file('coverage-result.json').get().asFile
    neoForge.runs {
        coverage {
            server()
            gameDirectory = coverageDir
            programArgument '--nogui'
            jvmArgument '-Xmx4G'
            jvmArgument '-XX:ActiveProcessorCount=4'
            systemProperty 'coverage.enabled', 'true'
            systemProperty 'coverage.result', coverageResult.absolutePath
            systemProperty 'coverage.resources', [rootProject.file('common/src/main/resources'), file('src/main/resources')].collect { it.absolutePath }.join('|')
        }
    }
    tasks.named('runCoverage') {
        doFirst {
            coverageResult.delete()
            coverageDir.mkdirs()
            new File(coverageDir, 'eula.txt').text = 'eula=true\n'
            new File(coverageDir, 'server.properties').text = 'online-mode=false\nserver-port=0\nlevel-seed=0\ngenerate-structures=false\n'
        }
    }
    tasks.register('coverageTest') {
        group = 'verification'
        description = 'Check registries, recipes, block placement/loot, item models and English names headlessly.'
        dependsOn 'runCoverage'
        doLast {
            if (!coverageResult.isFile()) throw new GradleException('Missing SELFTEST result')
            def result = new groovy.json.JsonSlurper().parse(coverageResult)
            if (result.failed != 0 || result.passed == 0) throw new GradleException("SELFTEST failures: ${result.errors}")
            logger.lifecycle("SELFTEST PASS: ${result.passed} checks, ${result.counts}")
        }
    }
}

// Keep development checks out of every archive, including explicit test builds.
tasks.withType(Jar).configureEach {
    exclude "ru/netherdon/netheragriculture/validation/CoverageSelfTest*"
}

// The separate verification mod is loaded only by the GameTest run.
sourceSets {
    verification {
        java.srcDir 'src/selftest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
neoForge.addModdingDependenciesTo(sourceSets.verification)
def checkedMod = neoForge.mods.getByName(mod_id)
def checksMod = neoForge.mods.create('netheragriculture_checks') { sourceSet sourceSets.verification }
neoForge.runs {
    client { loadedMods = [checkedMod] }
    server { loadedMods = [checkedMod] }
    gameTestServer {
        type = 'gameTestServer'
        gameDirectory = project.file('run/verification-gametest')
        loadedMods = [checkedMod, checksMod]
        systemProperty 'neoforge.enabledGameTestNamespaces', 'netheragriculture_checks'
        systemProperty 'coverage.resources', [rootProject.file('common/src/main/resources'), file('src/main/resources')].collect { it.absolutePath }.join('|')
        systemProperty 'coverage.result', layout.buildDirectory.file('gametest-coverage-result.json').get().asFile.absolutePath
        jvmArgument '-Xmx4G'
        jvmArgument '-XX:ActiveProcessorCount=4'
    }
}
